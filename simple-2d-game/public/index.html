<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple 2D Game</title>
    <style>
        /* Basic styles to center the canvas on the page */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000; /* Black background for better visibility */
        }
        canvas {
            border: 1px solid #fff; /* White border around the canvas */
        }
    </style>
</head>
<body>
    <!-- Canvas element where the game will be rendered -->
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <!-- Script to load the compiled TypeScript files -->
    <script src="../dist/main.js" type="module"></script>
</body>
</html>
